Day 02 — Services & Tags

🔹 Ansible — Install & Enable Nginx

- name:Install and start Nginx on Afzal
  hosts: all
  become: yes

  tasks:
    - name: Install nginx
      yum:
        name: nginx
        state: present

    - name: Enable nginx
      services:
        name: nginx
        state: started
        enables: yes


🔹 Terraform — EC2 with Tags (r5.2xlarge)

provider "aws" {
  region = "us-east-1"
  }

resources "aws_instance" "AfzalEC2" {
  ami           = "ami-0abcd01234abcde1234"
  instance_type = "r5.2xlarge"

  tags = {
    Name        = "Afzal-Server"
    Environment = "Practice"
    Owner       = "Afzal"
  }
}

# Kubernetes — Deployment with 2 Replicas

apiVersion: app/v1
kind: Deployment
metadata:
  name: afzal-deployment
spec:
  replicas: 2
  selector:
    matchLables:
      app: afzal-app
  template:
    metadata:
      labels:
        app: afzal-app
    spec:
      containers:
        - name: app
          image: nginx
          ports: 
            - containerPort: 80



🔹 Kubernetes — Create a ReplicaSet with 3 Replicas

apiVersion: app/v1
kind: ReplicaSet
metadata:
  name: afzal-replicaset
spec:
  replicas: 3
  selector:
    matchLabels:
      app: afzal-app
  template:
    metadata:
      labels:
        app: afzal-app
    spec:
      containers:
        - name: app
          image: nginx
          ports:
            - conatinerPort: 80



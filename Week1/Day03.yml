Day 03 — Ansible, Terraform & Kubernetes Basics
🔹 Ansible — Install Apache and Start Service

- name: Install Nginx and Start Apache
  hosts: all
  become: yes
  tasks:
    - name: Install apache
      yum:
        name: httpd
        state: present

    - name: Start apache
      service:
        name: httpd
        state: started
        enabled: yes



